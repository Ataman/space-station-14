- type: animationStateMachine
  id: AbsoluteClown
  states:
  - !Animation
    conditions:
    - !IsWalking
    action: !Waddle
  - !Animation
    conditions:
    - !IsWeightless
    action: !Rolling

- type: animationStateMachine
  id: RollingAnimationStateMachine
  states:
  - !Animation
    conditions:
    - !IsWalking
      ignoreMovementInput: true
    - !IsWeightless
    action: !Rolling

- type: animationStateMachine
  id: HoppingAnimationStateMachine
  states:
  - !Animation
    conditions:
    - !IsWalking
      ignoreMovementInput: true
    action: !Hopping
    oneShot: true
  timer: !RandomTimeRange
    minTime: 0.5
    maxTime: 2

- type: animationStateMachine
  id: EyeAnimationStateMachine
  states:
  - !SpriteChange
    conditions:
    - !HasMobState
      state: Alive
    action: !EyeBlink
    exitPeriod: 0.1
  timer: !RandomTimeRange
    minTime: 0.5
    maxTime: 5
